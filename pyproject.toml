[project]
name = "nova-vt"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "PyQt6",
    "moderngl",
    "pygltflib",
    "mediapipe",
    "opencv-python",
    "numpy",
    "sounddevice",
    "tomli-w",
    "twitchio",
    "google-api-python-client",
    "google-auth-oauthlib",
    "TikTokLive",
    "obsws-python",
    "python-osc",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
nova-vt = "nova_vt.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nova_vt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-k not slow')",
]
